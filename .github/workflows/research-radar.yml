name: Refresh SAM Research Radar

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-radar.yml"
      - "scripts/refresh-research-radar.mjs"
      - "data/research-radar.json"
      - "lib/research-radar.ts"
      - "data/radar-author-watchlist.json"
  workflow_dispatch:
  schedule:
    # Multiple staggered checks improve resilience to delayed/missed Actions cron.
    # Bangladesh local times: 07:17, 13:23, 19:29 and 01:35.
    # These are checks, not claims that arXiv publishes new papers every day.
    - cron: "17 1 * * *"
    - cron: "23 7 * * *"
    - cron: "29 13 * * *"
    - cron: "35 19 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: sam-research-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test verified-paper parser and ranking
        run: node scripts/test-research-radar.mjs
      - name: Fetch 13 official arXiv subject feeds with backup endpoints
        run: node scripts/refresh-research-radar.mjs
      - name: Commit verified snapshot (never fabricate records)
        run: |
          if git diff --quiet -- data/research-radar.json; then
            echo "No verified changes to publish."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/research-radar.json
            git commit -m "Update daily verified Research Radar arXiv digest"
            # Other Drive/website workflows may commit while we collect arXiv.
            # Retry non-fast-forward pushes without force, preserving their changes.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Concurrent Radar snapshot conflict; retry on next scheduled refresh."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Radar snapshot committed and published to main."
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Unable to push arXiv snapshot after 5 attempts."
                exit 1
              fi
              sleep $((3 * attempt))
            done
          fi
      - name: Republish site with refreshed Research Radar snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-drive.yml --repo shaikot996/research-group-website --ref main -f source=research-radar-daily
