name: Build and verify
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - name: Audit INSPIRE author identities for the joint 2026 preprint
        if: github.event_name == 'push'
        continue-on-error: true
        run: node scripts/check-inspire-paper-authors.mjs
      - run: npm run check:project
      - run: npm run test:content
      - run: npm run build
      - run: npm run typecheck
      - name: Check running site
        run: |
          npm start > /tmp/site.log 2>&1 &
          npm run test:smoke
