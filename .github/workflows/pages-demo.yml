name: Publish Demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build application
        run: |
          npm run setup
          npm run build

      - name: Start server and make static snapshot
        shell: bash
        run: |
          PORT=3000 npm start > /tmp/site.log 2>&1 &
          PID=$!

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 2
          done

          rm -rf _site

          wget \
            --recursive \
            --level=10 \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-host-directories \
            --execute robots=off \
            --directory-prefix=_site \
            http://127.0.0.1:3000/

          kill "$PID" || true

          # Copy everything from public as well
          cp -a public/. _site/

          touch _site/.nojekyll

          echo "===== GENERATED HTML PAGES ====="
          find _site -name '*.html' -print

      - name: Fix GitHub Pages paths
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path("_site")
          prefix = "/research-group-website"

          for f in root.rglob("*"):
              if not f.is_file():
                  continue

              if f.suffix.lower() in {".html", ".css", ".js"}:
                  try:
                      s = f.read_text(encoding="utf-8")
                  except Exception:
                      continue

                  # Absolute internal URLs -> GitHub Pages project path
                  s = re.sub(
                      r'(?P<q>["\'])/(?!/|research-group-website(?:/|["\']))',
                      lambda m: m.group("q") + prefix + "/",
                      s
                  )

                  # CSS url(/...)
                  s = re.sub(
                      r'url\((["\']?)/(?!/|research-group-website/)',
                      lambda m: "url(" + m.group(1) + prefix + "/",
                      s
                  )

                  f.write_text(s, encoding="utf-8")

          print("GitHub Pages path rewriting complete.")
          PY

      - name: Disable Next.js hydration for static GitHub Pages demo
        shell: bash
        run: |
          python <<'PYTHON'
          from pathlib import Path
          import re

          for f in Path("_site").rglob("*.html"):
              s = f.read_text(encoding="utf-8", errors="ignore")

              # Next.js hydration would restore routes such as /people,
              # ignoring the GitHub Pages repository prefix.
              s = re.sub(
                  r'<script\b[^>]*>.*?</script>',
                  '',
                  s,
                  flags=re.IGNORECASE | re.DOTALL
              )

              # Final safety pass for internal absolute links.
              s = re.sub(
                  r'href="/(?!research-group-website/)([^"#?]*)',
                  r'href="/research-group-website/\1',
                  s
              )

              f.write_text(s, encoding="utf-8")

          print("Removed Next.js hydration scripts and fixed static links.")
          PYTHON

      - name: Show generated site
        run: |
          echo "===== FILES ====="
          find _site -maxdepth 4 -type f | sort | head -200

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
