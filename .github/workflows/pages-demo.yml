name: Publish Demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site and create static demo
        shell: bash
        run: |
          npm run setup
          npm run build

          PORT=3000 BIND_HOST=127.0.0.1 npm start > /tmp/research-site.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              READY=1
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server stopped unexpectedly:"
              cat /tmp/research-site.log
              exit 1
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Site did not start."
            cat /tmp/research-site.log
            exit 1
          fi

          rm -rf snapshot _site
          mkdir -p snapshot _site

          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --execute robots=off \
            --reject-regex='/(admin|api)(/|$)' \
            --directory-prefix=snapshot \
            http://127.0.0.1:3000/

          cp -a snapshot/127.0.0.1:3000/. _site/

          # Make sure all public images/assets are included.
          cp -a public/. _site/

          # GitHub Pages does not need Next.js client/server runtime for
          # this read-only demo. Remove hydration scripts so navigation
          # behaves as ordinary static HTML.
          python <<'PY'
          from pathlib import Path
          import re

          root = Path("_site")

          for file in root.rglob("*.html"):
              text = file.read_text(encoding="utf-8", errors="ignore")
              text = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  "",
                  text,
                  flags=re.IGNORECASE | re.DOTALL,
              )
              file.write_text(text, encoding="utf-8")
          PY

          touch _site/.nojekyll

          echo "Generated pages:"
          find _site -type f | head -50

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
