name: Sync Drive profiles and publish demo

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Offset from GitHub's high-traffic top-of-hour slot.
    # Re-register the scheduler after observed missing cron-triggered runs.
    - cron: "4-59/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: drive-profile-sync
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GOOGLE_DRIVE_ROOT_FOLDER_ID: "10_rzMMevZi6_T-bajAnmaynab0UbDBtv"
      GOOGLE_DRIVE_RA_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_RA_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
      # University custom domain is the root, not a GitHub project path.
      GITHUB_PAGES_BASE_PATH: ""
      SITE_URL: https://sam.cse.bracu.ac.bd
      EXPORT_OUT_DIR: _site
      EXPORT_ORIGIN: http://127.0.0.1:4173
      PORT: "4173"
      BIND_HOST: 127.0.0.1

    steps:
      - name: Explain invocation
        run: echo "SAM sync invoked by ${{ github.event_name }} at $(date -u +%Y-%m-%dT%H:%M:%SZ) on ${{ github.ref_name }}"
      - uses: actions/checkout@v4

      - name: Regression test for root-domain Pages export
        run: node scripts/test-pages-export-fixture.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run setup

      # Publish successfully synced people even if one person's import fails.
      # Fail visibly after deployment; do not silently report a green sync.
      - name: Sync Research Assistants from Drive
        id: drive_sync
        continue-on-error: true
        run: npm run sync:drive

      # Root discovery failed: preserve the previous published Pages snapshot.
      - name: Verify Drive root discovery
        if: steps.drive_sync.outputs.root_ok != 'true'
        run: |
          echo "::error::Google Drive RA root could not be read. Keeping the last working Pages deployment."
          exit 1

      - name: Sync Principal Investigators and Co-PIs from Google Docs
        id: leader_sync
        continue-on-error: true
        run: npm run sync:leaders

      # Do not deploy a partially initialized fallback portrait/CV snapshot when
      # Drive listing/download errors prevented a complete leader sync.
      - name: Verify PI and Co-PI sync before publishing
        if: steps.leader_sync.outcome != 'success'
        run: |
          echo "::error::PI/Co-PI Drive sync incomplete; keeping the previous Pages deployment."
          exit 1

      - name: Refresh INSPIRE citations when cache is stale
        run: npm run sync:inspire

      - run: npm run check:project
      - run: npm run typecheck
      - run: npm run build

      - name: Start production app
        run: |
          npm start > /tmp/sam-site.log 2>&1 &
          echo $! > /tmp/sam-site.pid
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sam-site.log
          exit 1

      - name: Export static GitHub Pages snapshot
        run: node scripts/export-github-pages.mjs

      - name: Verify custom-domain export and required assets
        run: node scripts/verify-pages-export.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Stop production app
        if: always()
        run: test ! -f /tmp/sam-site.pid || kill "$(cat /tmp/sam-site.pid)" || true

      - name: Report failed Drive profile imports
        if: always() && (steps.drive_sync.outcome == 'failure' || steps.leader_sync.outcome == 'failure')
        run: |
          echo "::error::Google Drive RA or PI/Co-PI sync failed for one or more profiles; check individual sync step logs. The previous/live site is preserved if root discovery failed."
          exit 1
