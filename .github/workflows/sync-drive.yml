name: Sync Drive profiles and publish demo

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: drive-profile-sync
  cancel-in-progress: true

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GOOGLE_DRIVE_ROOT_FOLDER_ID: "10_rzMMevZi6_T-bajAnmaynab0UbDBtv"
      GOOGLE_DRIVE_RA_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_RA_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
      GITHUB_PAGES_BASE_PATH: /research-group-website
      EXPORT_OUT_DIR: _site
      EXPORT_ORIGIN: http://127.0.0.1:4173
      PORT: "4173"
      BIND_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run setup

      - name: Sync Research Assistants from Drive
        run: npm run sync:drive:optional

      - name: Refresh INSPIRE citations when cache is stale
        run: npm run sync:inspire

      - run: npm run check:project
      - run: npm run typecheck
      - run: npm run build

      - name: Start production app
        run: |
          npm start > /tmp/sam-site.log 2>&1 &
          echo $! > /tmp/sam-site.pid
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sam-site.log
          exit 1

      - name: Export static GitHub Pages snapshot
        run: node scripts/export-github-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Stop production app
        if: always()
        run: test ! -f /tmp/sam-site.pid || kill "$(cat /tmp/sam-site.pid)" || true
